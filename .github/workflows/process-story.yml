name: Hidden Beyond Story Processor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/process-story.yml"
      - "scripts/process_story.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-story-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STORY_PROCESSOR_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/story-processor-api
      STORY_TRANSLATION_MODEL: Helsinki-NLP/opus-mt-zh-vi
      STORY_REWRITE_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      STORY_TTS_VOICE: vi_VN-vais1000-medium

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install story processing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          pip install             "torch>=2.2"             "transformers>=4.45,<5"             "sentencepiece>=0.2,<1"             "sacremoses>=0.1"             "accelerate>=0.34"             "pillow>=10,<12"             "piper-tts>=1.2,<2"

      - name: Download commercially usable Vietnamese Piper voice
        run: |
          curl -fL             "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx"             -o vi_VN-vais1000-medium.onnx
          curl -fL             "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx.json"             -o vi_VN-vais1000-medium.onnx.json

      - name: Claim, write Vietnamese story, synthesize voice and render private preview
        shell: bash
        run: |
          set -Eeuo pipefail

          get_oidc() {
            curl -fsS               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-story-processor"               | python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          CLAIMED=0
          COMPLETED=0
          EPISODE_ID=""

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$CLAIMED" = "1" ] && [ "$COMPLETED" = "0" ]; then
              token="$(get_oidc || true)"
              if [ -n "$token" ]; then
                err="story processor workflow failed with exit code $rc"
                if [ -f story_metadata.json ]; then
                  err="$(python -c 'import json; d=json.load(open("story_metadata.json")); print(d.get("error") or d.get("status") or "story processing failed")' 2>/dev/null || echo "$err")"
                fi
                jq -n --argjson episode_id "$EPISODE_ID" --arg error "$err"                   '{episode_id:$episode_id,error:$error}' > fail.json
                curl -sS -X POST "$STORY_PROCESSOR_API/fail"                   -H "Authorization: Bearer $token"                   -H "content-type: application/json"                   --data-binary @fail.json || true
              fi
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          token="$(get_oidc)"
          curl -fsS -X POST "$STORY_PROCESSOR_API/claim"             -H "Authorization: Bearer $token"             -H "content-type: application/json"             -d '{}' > story_claim.json

          stage="$(jq -r '.stage' story_claim.json)"
          if [ "$stage" = "idle" ]; then
            echo "No eligible ordered story episode is waiting."
            COMPLETED=1
            exit 0
          fi
          if [ "$stage" != "claimed" ]; then
            cat story_claim.json
            exit 1
          fi

          CLAIMED=1
          EPISODE_ID="$(jq -r '.job.episode_id' story_claim.json)"
          SERIES_TITLE="$(jq -r '.job.series_title' story_claim.json)"
          EPISODE_NO="$(jq -r '.job.episode_no' story_claim.json)"
          NARRATION_URL="$(jq -r '.job.narration.signedUrl' story_claim.json)"
          NARRATION_PATH="$(jq -r '.job.narration.path' story_claim.json)"
          PREVIEW_URL="$(jq -r '.job.preview.signedUrl' story_claim.json)"
          PREVIEW_PATH="$(jq -r '.job.preview.path' story_claim.json)"
          jq -r '.job.source_text' story_claim.json > source_zh.txt

          python scripts/process_story.py             --source-text source_zh.txt             --series-title "$SERIES_TITLE"             --episode-no "$EPISODE_NO"             --voice-model vi_VN-vais1000-medium.onnx             --voice-config vi_VN-vais1000-medium.onnx.json             --script-out story_vi.txt             --audio-out narration_vi.wav             --preview-out story_preview.mp4             --metadata-out story_metadata.json

          curl -fsS -X PUT "$NARRATION_URL"             -H "content-type: audio/wav"             -H "cache-control: max-age=3600"             --data-binary @narration_vi.wav

          curl -fsS -X PUT "$PREVIEW_URL"             -H "content-type: video/mp4"             -H "cache-control: max-age=3600"             --data-binary @story_preview.mp4

          token="$(get_oidc)"
          jq -n             --argjson episode_id "$EPISODE_ID"             --arg title_vi "$(jq -r '.title_vi' story_metadata.json)"             --rawfile script_vi story_vi.txt             --arg narration_path "$NARRATION_PATH"             --arg preview_path "$PREVIEW_PATH"             --arg translation_model "$(jq -r '.translation_model' story_metadata.json)"             --arg rewrite_model "$(jq -r '.rewrite_model' story_metadata.json)"             --arg tts_voice "$(jq -r '.tts_voice' story_metadata.json)"             --arg generation_notes "$(jq -r '.generation_notes' story_metadata.json)"             --argjson visual_plan "$(jq -c '.visual_plan' story_metadata.json)"             '{
              episode_id:$episode_id,
              title_vi:$title_vi,
              script_vi:$script_vi,
              narration_path:$narration_path,
              preview_path:$preview_path,
              translation_model:$translation_model,
              rewrite_model:$rewrite_model,
              tts_voice:$tts_voice,
              generation_notes:$generation_notes,
              visual_plan:$visual_plan
            }' > story_complete.json

          curl -fsS -X POST "$STORY_PROCESSOR_API/complete"             -H "Authorization: Bearer $token"             -H "content-type: application/json"             --data-binary @story_complete.json > story_complete_response.json

          jq . story_complete_response.json
          COMPLETED=1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-processor-diagnostics
          path: |
            story_claim.json
            story_metadata.json
            story_complete_response.json
          if-no-files-found: ignore
          retention-days: 3
