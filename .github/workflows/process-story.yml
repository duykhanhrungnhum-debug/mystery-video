name: Hidden Beyond Story Processor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/process-story.yml"
      - "scripts/process_story.py"
      - "requirements-story.txt"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  process:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source_key:
          - journey_to_the_west
          - romance_three_kingdoms
          - water_margin_120
          - investiture_gods
          - strange_tales

    runs-on: ubuntu-latest
    timeout-minutes: 90

    concurrency:
      group: hidden-beyond-story-${{ matrix.source_key }}
      cancel-in-progress: false

    env:
      STORY_PROCESSOR_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/story-processor-api
      STORY_TRANSLATION_MODEL: Helsinki-NLP/opus-mt-zh-vi
      STORY_REWRITE_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      STORY_TTS_VOICE: vi_VN-vais1000-medium
      STORY_SOURCE_KEY: ${{ matrix.source_key }}
      STORY_EPISODES_PER_RUN: "2"
      HF_HOME: ${{ github.workspace }}/.story-cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-story.txt

      - name: Restore AI model and voice cache
        uses: actions/cache@v4
        with:
          path: |
            .story-cache
          key: story-ai-v3-${{ runner.os }}-${{ hashFiles('requirements-story.txt') }}
          restore-keys: |
            story-ai-v3-${{ runner.os }}-

      - name: Install only missing system dependencies
        shell: bash
        run: |
          set -e
          need_apt=0
          command -v ffmpeg >/dev/null 2>&1 || need_apt=1
          fc-match "Noto Sans" >/dev/null 2>&1 || need_apt=1
          if [ "$need_apt" = "1" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-core
          fi

      - name: Install cached Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-story.txt

      - name: Prepare cached Vietnamese voice
        shell: bash
        run: |
          set -e
          mkdir -p .story-cache/voices
          VOICE=".story-cache/voices/vi_VN-vais1000-medium.onnx"
          CONFIG=".story-cache/voices/vi_VN-vais1000-medium.onnx.json"
          if [ ! -s "$VOICE" ]; then
            curl -fL               "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx"               -o "$VOICE"
          fi
          if [ ! -s "$CONFIG" ]; then
            curl -fL               "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx.json"               -o "$CONFIG"
          fi

      - name: Process ordered episodes for this series
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics

          get_oidc() {
            curl -fsS               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-story-processor"               | python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          mark_failed() {
            local episode_id="$1"
            local message="$2"
            local token
            token="$(get_oidc || true)"
            if [ -n "$token" ]; then
              jq -n --argjson episode_id "$episode_id" --arg error "$message"                 '{episode_id:$episode_id,error:$error}' > diagnostics/fail.json
              curl -sS -X POST "$STORY_PROCESSOR_API/fail"                 -H "Authorization: Bearer $token"                 -H "content-type: application/json"                 --data-binary @diagnostics/fail.json || true
            fi
          }

          for run_no in $(seq 1 "$STORY_EPISODES_PER_RUN"); do
            rm -f source_zh.txt story_vi.txt narration_vi.wav story_preview.mp4 story_metadata.json

            token="$(get_oidc)"
            jq -n --arg source_key "$STORY_SOURCE_KEY" '{source_key:$source_key}' > claim-request.json
            curl -fsS -X POST "$STORY_PROCESSOR_API/claim"               -H "Authorization: Bearer $token"               -H "content-type: application/json"               --data-binary @claim-request.json > story_claim.json

            cp story_claim.json "diagnostics/claim-${run_no}.json"
            stage="$(jq -r '.stage' story_claim.json)"
            if [ "$stage" = "idle" ]; then
              echo "No ordered episode waiting for $STORY_SOURCE_KEY."
              break
            fi
            if [ "$stage" != "claimed" ]; then
              cat story_claim.json
              exit 1
            fi

            EPISODE_ID="$(jq -r '.job.episode_id' story_claim.json)"
            SERIES_TITLE="$(jq -r '.job.series_title' story_claim.json)"
            EPISODE_NO="$(jq -r '.job.episode_no' story_claim.json)"
            NARRATION_URL="$(jq -r '.job.narration.signedUrl' story_claim.json)"
            NARRATION_PATH="$(jq -r '.job.narration.path' story_claim.json)"
            PREVIEW_URL="$(jq -r '.job.preview.signedUrl' story_claim.json)"
            PREVIEW_PATH="$(jq -r '.job.preview.path' story_claim.json)"
            jq -r '.job.source_text' story_claim.json > source_zh.txt

            set +e
            python scripts/process_story.py               --source-text source_zh.txt               --series-title "$SERIES_TITLE"               --episode-no "$EPISODE_NO"               --voice-model .story-cache/voices/vi_VN-vais1000-medium.onnx               --voice-config .story-cache/voices/vi_VN-vais1000-medium.onnx.json               --script-out story_vi.txt               --audio-out narration_vi.wav               --preview-out story_preview.mp4               --metadata-out story_metadata.json
            processor_rc=$?
            set -e

            if [ -f story_metadata.json ]; then
              cp story_metadata.json "diagnostics/metadata-${run_no}.json"
            fi

            if [ "$processor_rc" -ne 0 ]; then
              err="$(python -c 'import json; d=json.load(open("story_metadata.json")); print(d.get("error") or "story processor failed")' 2>/dev/null || echo "story processor failed")"
              mark_failed "$EPISODE_ID" "$err"
              exit "$processor_rc"
            fi

            if ! curl -fsS -X PUT "$NARRATION_URL"               -H "content-type: audio/wav"               -H "cache-control: max-age=3600"               --data-binary @narration_vi.wav; then
              mark_failed "$EPISODE_ID" "narration upload failed"
              exit 1
            fi

            if ! curl -fsS -X PUT "$PREVIEW_URL"               -H "content-type: video/mp4"               -H "cache-control: max-age=3600"               --data-binary @story_preview.mp4; then
              mark_failed "$EPISODE_ID" "preview upload failed"
              exit 1
            fi

            token="$(get_oidc)"
            jq -n               --argjson episode_id "$EPISODE_ID"               --arg title_vi "$(jq -r '.title_vi' story_metadata.json)"               --rawfile script_vi story_vi.txt               --arg narration_path "$NARRATION_PATH"               --arg preview_path "$PREVIEW_PATH"               --arg translation_model "$(jq -r '.translation_model' story_metadata.json)"               --arg rewrite_model "$(jq -r '.rewrite_model' story_metadata.json)"               --arg tts_voice "$(jq -r '.tts_voice' story_metadata.json)"               --arg generation_notes "$(jq -r '.generation_notes' story_metadata.json)"               --argjson visual_plan "$(jq -c '.visual_plan' story_metadata.json)"               '{
                episode_id:$episode_id,
                title_vi:$title_vi,
                script_vi:$script_vi,
                narration_path:$narration_path,
                preview_path:$preview_path,
                translation_model:$translation_model,
                rewrite_model:$rewrite_model,
                tts_voice:$tts_voice,
                generation_notes:$generation_notes,
                visual_plan:$visual_plan
              }' > story_complete.json

            if ! curl -fsS -X POST "$STORY_PROCESSOR_API/complete"               -H "Authorization: Bearer $token"               -H "content-type: application/json"               --data-binary @story_complete.json > story_complete_response.json; then
              mark_failed "$EPISODE_ID" "complete callback failed"
              exit 1
            fi

            cp story_complete_response.json "diagnostics/complete-${run_no}.json"
            jq . story_complete_response.json
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-diagnostics-${{ matrix.source_key }}-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
