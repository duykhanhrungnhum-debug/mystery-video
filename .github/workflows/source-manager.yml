name: Hidden Beyond Source Manager Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/source-manager.trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-source-manager
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_AUDIT_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/source-audit-api
    steps:
      - uses: actions/checkout@v4

      - name: Fixed source pool only
        run: |
          echo "SOURCE_DISCOVERY_DISABLED"
          echo "Bot may use only the fixed 5-source pool already approved in Supabase."

      - name: Upload source-manager evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-manager-audit
          path: |
            source-audit-request.json
            source-audit-response.json
          retention-days: 7
          if-no-files-found: error
