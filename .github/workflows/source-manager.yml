name: Hidden Beyond Fixed Source Pool

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fixed-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source discovery is disabled
        run: |
          set -Eeuo pipefail
          test -s config/hidden_beyond_fixed_sources.json
          python - <<'PY'
          import json
          d=json.load(open("config/hidden_beyond_fixed_sources.json",encoding="utf-8"))
          sources=d.get("sources") or []
          assert d.get("discover_new_sources") is False
          assert len(sources)==5, len(sources)
          assert [x["rotation_order"] for x in sources]==[1,2,3,4,5]
          print("FIXED_SOURCE_POOL_OK count=5 discovery=false")
          PY
