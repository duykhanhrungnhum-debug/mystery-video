name: Hidden Beyond Bot2 Kaggle Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/bot2-kaggle-preflight.trigger"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Check Kaggle secret presence only
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            echo "BOT2_KAGGLE_SECRET_PRESENT=true"
          else
            echo "BOT2_KAGGLE_SECRET_PRESENT=false"
            exit 2
          fi
