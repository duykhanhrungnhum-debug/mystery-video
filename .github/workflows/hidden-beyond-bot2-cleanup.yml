name: Hidden Beyond Bot2 Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/bot2.cleanup"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stop-stale-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT2_KAGGLE_BROKER_URL: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-kaggle-broker
      BOT2_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-bot2
    steps:
      - uses: actions/checkout@v4

      - name: Delete stale Bot2 GPU kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          VIDEO_ID="$(sed -n 's/^video_id=//p' .github/bot2.cleanup | head -1)"
          test -n "$VIDEO_ID"
          SLUG="$(printf '%s' "$VIDEO_ID" | tr '[:upper:]_' '[:lower:]-')"
          REF="duykhanhta/hidden-beyond-bot2-ai-$SLUG"
          OIDC="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-kaggle-broker"             | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python - "$REF" <<'PY' > delete.json
          import json,sys
          print(json.dumps({"ref":sys.argv[1]}))
          PY
          curl --fail-with-body -sS -X POST "$BOT2_KAGGLE_BROKER_URL/delete-kernel"             -H "Authorization: Bearer $OIDC"             -H "content-type: application/json"             --data-binary @delete.json > delete-result.json
          cat delete-result.json
          BOT2_OIDC="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python - "$VIDEO_ID" <<'PY' > gpu-released.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1]}))
          PY
          curl --fail-with-body -sS -X POST "$BOT2_API/gpu-released" \
            -H "Authorization: Bearer $BOT2_OIDC" \
            -H "content-type: application/json" \
            --data-binary @gpu-released.json > /dev/null || true
          echo "BOT2_GPU_STATE_CLEAR_REQUESTED"
