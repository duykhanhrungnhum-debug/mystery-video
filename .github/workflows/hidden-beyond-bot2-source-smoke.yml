name: Hidden Beyond Bot2 Source Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/bot2-source-smoke.trigger"

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader
        run: python -m pip install --quiet -U "yt-dlp>=2026.1"

      - name: Test embedded client once without GPU
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://www.youtube.com/watch?v=z56-Xzl-fkY"
          python -m yt_dlp -v             --no-playlist             --retries 1             --fragment-retries 1             --extractor-args "youtube:player_client=web_embedded"             --download-sections "*0-20"             -f "b[height<=480]/b"             --merge-output-format mp4             -o source-smoke.mp4             "$URL"
          test -s source-smoke.mp4
          echo "BOT2_SOURCE_EMBEDDED_OK bytes=$(stat -c%s source-smoke.mp4)"
