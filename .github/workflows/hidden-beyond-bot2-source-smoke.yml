name: Hidden Beyond Bot2 Source Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/bot2-source-smoke.trigger"

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader and PO provider plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet -U "yt-dlp>=2026.1" bgutil-ytdlp-pot-provider
          docker run --name bgutil-provider -d --init             -p 127.0.0.1:4416:4416             brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Test next fixed-source video without GPU
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://www.youtube.com/watch?v=z56-Xzl-fkY"
          python -m yt_dlp -v             --no-playlist             --retries 2             --fragment-retries 2             --remote-components ejs:github             --extractor-args "youtube:player_client=mweb"             --download-sections "*0-20"             -f "b[height<=480]/b"             --merge-output-format mp4             -o source-smoke.mp4             "$URL"
          test -s source-smoke.mp4
          echo "BOT2_SOURCE_SMOKE_OK bytes=$(stat -c%s source-smoke.mp4)"

      - name: Provider logs on failure
        if: failure()
        run: docker logs --tail 120 bgutil-provider || true
