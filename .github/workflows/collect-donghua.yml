name: Hidden Beyond Donghua Collector

on:
  push:
    branches: [main]
    paths:
      - ".github/collect-donghua.trigger"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidden-beyond-donghua-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rlqqcuuphjmwksanbfml.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -e . supabase feedparser yt-dlp
      - name: Collect fixed donghua rotation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python scripts/collect_donghua_rotation.py
