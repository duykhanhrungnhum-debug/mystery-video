name: Hidden Beyond Donghua Collector

on:
  push:
    branches: [main]
    paths:
      - ".github/collect-donghua.trigger"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-donghua-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rlqqcuuphjmwksanbfml.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -e . supabase feedparser yt-dlp
      - name: Collect fixed donghua rotation
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-collector" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsSL -X POST "$SUPABASE_URL/functions/v1/donghua-collector-config" -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" > sources.json
          python scripts/collect_donghua_rotation.py --sources-json sources.json
