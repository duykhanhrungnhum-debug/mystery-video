name: Hidden Beyond Bot2

on:
  push:
    branches: [main]
    paths:
      - ".github/bot2.trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-bot2
  cancel-in-progress: false

jobs:
  process-one-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BOT2_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-bot2
      BOT2_KAGGLE_BROKER_URL: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-kaggle-broker
      KAGGLE_USERNAME: duykhanhta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bot2 controller
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet -e .

      - name: Preflight configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${BOT2_KAGGLE_BROKER_URL:-}" || {
            echo "::error title=Bot2 Kaggle broker missing::BOT2_KAGGLE_BROKER_URL is not configured."
            exit 2
          }
          echo "BOT2_PREFLIGHT_OK kaggle_auth=AI_to_Supabase_Vault_broker"

      - name: Claim exactly one fixed-source episode
        id: claim
        shell: bash
        run: |
          set -Eeuo pipefail
          get_oidc() {
            curl -fsSL               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2"               | python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          OIDC="$(get_oidc)"
          if curl --fail-with-body --retry 2 --retry-delay 2 --retry-all-errors -sS -X POST "$BOT2_API/refresh-fixed-sources" \
              -H "Authorization: Bearer $OIDC" \
              -H "content-type: application/json" \
              -d '{}' > bot2-source-refresh.json; then
            python - <<'PY'
          import json
          d=json.load(open("bot2-source-refresh.json",encoding="utf-8"))
          print(
              "BOT2_FIXED_SOURCE_REFRESH",
              "inserted="+str(d.get("inserted_count",0)),
              "skipped="+str(len(d.get("skipped") or [])),
          )
          PY
          else
            echo "::warning title=Bot2 fixed-source refresh failed::Continuing with the already approved queue. Exact requests will still fail closed if the requested episode is unavailable."
          fi
          python scripts/bot2_build_request.py \
            --event "$GITHUB_EVENT_NAME" \
            --trigger .github/bot2.trigger \
            --output bot2-next-request.json
          curl --fail-with-body --retry 5 --retry-delay 3 --retry-max-time 30 --retry-all-errors -sS -X POST "$BOT2_API/next" \
            -H "Authorization: Bearer $OIDC" \
            -H "content-type: application/json" \
            --data-binary @bot2-next-request.json > bot2-job.json
          STAGE="$(python -c 'import json; print(json.load(open("bot2-job.json")).get("stage",""))')"
          if [ "$STAGE" = "target_missing" ] || [ "$STAGE" = "already_completed" ]; then
            echo "run_job=false" >> "$GITHUB_OUTPUT"
            echo "reuse_source=false" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          d=json.load(open("bot2-job.json",encoding="utf-8"))
          print("BOT2_TARGET_NOOP", json.dumps(d,ensure_ascii=False))
          PY
            exit 0
          fi
          if [ "$STAGE" = "target_invalid" ] || [ "$STAGE" = "target_conflict" ]; then
            python - <<'PY'
          import json
          d=json.load(open("bot2-job.json",encoding="utf-8"))
          print("::error title=Bot2 selection blocked::"+json.dumps(d,ensure_ascii=False))
          PY
            exit 4
          fi
          if [ "$STAGE" = "idle" ]; then
            echo "run_job=false" >> "$GITHUB_OUTPUT"
            echo "reuse_source=false" >> "$GITHUB_OUTPUT"
            echo "BOT2_IDLE"
            exit 0
          fi
          if [ "$STAGE" = "job_active" ]; then
            echo "::error title=Bot2 job already active::A previous episode is still active."
            exit 3
          fi
          if [ "$STAGE" = "recover_upload" ]; then
            curl --fail-with-body -sS -X POST "$BOT2_API/recover-upload" \
              -H "Authorization: Bearer $OIDC" \
              -H "content-type: application/json" \
              -d '{}' > bot2-recover.json
            python - <<'PY'
          import json
          d=json.load(open("bot2-recover.json",encoding="utf-8"))
          print("BOT2_UPLOAD_RECOVERED", d.get("youtube_video_id",""))
          PY
            echo "run_job=false" >> "$GITHUB_OUTPUT"
            echo "reuse_source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STAGE" = "resume_source_ready" ]; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
            echo "reuse_source=true" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          d=json.load(open("bot2-job.json",encoding="utf-8"))
          ref=str(d.get("source_kernel_ref") or "")
          size=int(d.get("source_bytes") or 0)
          if not ref or size <= 1_000_000:
              raise SystemExit("verified source missing during resume")
          open("source-kernel-ref.txt","w",encoding="utf-8").write(ref+"\n")
          print(
              "BOT2_RESUME_SOURCE",
              "rotation="+str(d["rotation"]),
              "source_id="+str(d["item"]["source_id"]),
              "series_id="+str(d["item"]["series_id"]),
              "episode="+str(d["item"]["episode_number"]),
              "video_id="+str(d["item"]["source_item_id"]),
              "bytes="+str(size),
          )
          PY
          else
            test "$STAGE" = "selected"
            echo "run_job=true" >> "$GITHUB_OUTPUT"
            echo "reuse_source=false" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          d=json.load(open("bot2-job.json",encoding="utf-8"))
          print(
              "BOT2_SELECTED",
              "rotation="+str(d["rotation"]),
              "source_id="+str(d["item"]["source_id"]),
              "series_id="+str(d["item"]["series_id"]),
              "episode="+str(d["item"]["episode_number"]),
              "video_id="+str(d["item"]["source_item_id"]),
          )
          PY
          fi
          python scripts/bot2_build_request.py \
            --verify-request bot2-next-request.json \
            --verify-job bot2-job.json
          CPU_READY="$(python -c 'import json; d=json.load(open("bot2-job.json",encoding="utf-8")); print("true" if d.get("checkpoint_cpu_ready") else "false")')"
          if [ "$CPU_READY" = "true" ]; then
            echo "need_gpu=false" >> "$GITHUB_OUTPUT"
            echo "BOT2_RESUME_STAGE translation_complete cpu_ready=true; GPU will be skipped"
          else
            echo "need_gpu=true" >> "$GITHUB_OUTPUT"
            PHASE="$(python -c 'import json; d=json.load(open("bot2-job.json")); print(d.get("checkpoint_phase") or "source_ready")')"
            CURSOR="$(python -c 'import json; d=json.load(open("bot2-job.json")); print(d.get("checkpoint_cursor") or 0)')"
            echo "BOT2_RESUME_STAGE phase=$PHASE cursor=$CURSOR; GPU required only for unfinished AI stage"
          fi

      - name: Submit CPU source job
        if: steps.claim.outputs.run_job == 'true' && steps.claim.outputs.reuse_source != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
          BROKER_OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-kaggle-broker" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          export BOT2_KAGGLE_BROKER_TOKEN="$BROKER_OIDC"
          if ! python scripts/bot2_submit_source.py --job bot2-job.json; then
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"source_submit","error":"Kaggle CPU source submission failed"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi

      - name: Wait for verified source
        if: steps.claim.outputs.run_job == 'true' && steps.claim.outputs.reuse_source != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
          READY=0
          for i in $(seq 1 90); do
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            curl --fail-with-body --retry 2 --retry-all-errors -sS -X POST "$BOT2_API/status"               -H "Authorization: Bearer $OIDC" -H "content-type: application/json" -d '{}' > bot2-status.json
            STATE="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d["status"])')"
            STAGE="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d["stage"])')"
            MSG="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d.get("last_message") or "")')"
            echo "BOT2_SOURCE_PROGRESS poll=$i state=$STATE stage=$STAGE message=$MSG"
            if [ "$STATE" = "failed" ]; then
              echo "::error title=Bot2 source failed::$STAGE / $MSG"
              exit 1
            fi
            if [ "$STAGE" = "source_ready" ]; then
              SOURCE_REF="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d.get("source_kernel_ref") or "")')"
              SOURCE_BYTES="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d.get("source_bytes") or 0)')"
              test -n "$SOURCE_REF"
              test "$SOURCE_BYTES" -gt 1000000
              echo "$SOURCE_REF" > source-kernel-ref.txt
              echo "BOT2_SOURCE_READY ref=$SOURCE_REF bytes=$SOURCE_BYTES"
              READY=1
              break
            fi
            sleep 20
          done
          if [ "$READY" != "1" ]; then
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"source_timeout","error":"Source did not become ready within 30 minutes"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi
          # Source callback happens just before the Kaggle CPU kernel exits.
          # Give Kaggle a bounded publish window before mounting its output.
          sleep 60

      - name: Create YouTube Public upload session
        if: steps.claim.outputs.run_job == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python - "$VIDEO_ID" <<'PY' > youtube-request.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1]}))
          PY
          if ! curl --fail-with-body --retry 3 --retry-all-errors -sS -X POST "$BOT2_API/youtube-session"             -H "Authorization: Bearer $OIDC" -H "content-type: application/json"             --data-binary @youtube-request.json > youtube-session.json; then
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"youtube_session","error":"Could not create YouTube resumable session"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi
          test "$(python -c 'import json; print(json.load(open("youtube-session.json")).get("stage",""))')" = "youtube_upload_ready"
          echo "BOT2_YOUTUBE_SESSION_READY"

      - name: Submit mounted-source GPU translation job
        if: steps.claim.outputs.run_job == 'true' && steps.claim.outputs.need_gpu == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
          SOURCE_REF="$(cat source-kernel-ref.txt)"
          BROKER_OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-kaggle-broker" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          export BOT2_KAGGLE_BROKER_TOKEN="$BROKER_OIDC"
          if ! python scripts/bot2_submit_gpu.py             --job bot2-job.json             --youtube-session youtube-session.json             --source-ref "$SOURCE_REF"; then
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"gpu_submit","error":"Kaggle GPU AI submission failed"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi
          GPU_REF="$(python -c 'import json; print(json.load(open("bot2-gpu-submission.json"))["ref"])')"
          TOKEN="$(python -c 'import json; print(json.load(open("bot2-job.json"))["job_token"])')"
          python - "$VIDEO_ID" "$GPU_REF" <<'PY' > gpu-stage.json
          import json,sys
          print(json.dumps({
              "source_video_id":sys.argv[1],
              "stage":"gpu_submitted",
              "message":"Mounted-source GPU worker submitted",
              "gpu_kernel_ref":sys.argv[2],
          }))
          PY
          curl --fail-with-body -sS -X POST "$BOT2_API/worker-stage"             -H "x-bot2-token: $TOKEN" -H "content-type: application/json"             --data-binary @gpu-stage.json > /dev/null
          echo "BOT2_GPU_SUBMITTED ref=$GPU_REF"

      - name: Follow GPU translation checkpoint
        if: steps.claim.outputs.run_job == 'true' && steps.claim.outputs.need_gpu == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          READY=0
          for i in $(seq 1 220); do
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            curl --fail-with-body --retry 2 --retry-all-errors -sS -X POST "$BOT2_API/status" \
              -H "Authorization: Bearer $OIDC" -H "content-type: application/json" -d '{}' > bot2-status.json
            STATE="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d["status"])')"
            STAGE="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d["stage"])')"
            MSG="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d.get("last_message") or "")')"
            echo "BOT2_GPU_PROGRESS poll=$i state=$STATE stage=$STAGE message=$MSG"
            if [ "$STATE" = "failed" ]; then
              echo "::error title=Bot2 GPU translation stopped::$STAGE / $MSG"
              exit 1
            fi
            if [ "$STAGE" = "translation_complete" ]; then
              echo "BOT2_TRANSLATION_CHECKPOINT_READY"
              READY=1
              break
            fi
            sleep 30
          done
          if [ "$READY" != "1" ]; then
            VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"translation_timeout","error":"GPU translation checkpoint did not finish within 110 minutes"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi

      - name: Release temporary GPU kernel
        if: always() && steps.claim.outputs.run_job == 'true' && steps.claim.outputs.need_gpu == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f bot2-gpu-submission.json ]; then
            echo "BOT2_GPU_RELEASE_SKIP no_submission_file"
            exit 0
          fi
          GPU_REF="$(python -c 'import json; print(json.load(open("bot2-gpu-submission.json")).get("ref") or "")')"
          if [ -z "$GPU_REF" ]; then
            echo "BOT2_GPU_RELEASE_SKIP no_ref"
            exit 0
          fi
          BROKER_OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-kaggle-broker" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python - "$GPU_REF" <<'PY' > delete-gpu.json
          import json,sys
          print(json.dumps({"ref":sys.argv[1]}))
          PY
          if curl --fail-with-body -sS -X POST "$BOT2_KAGGLE_BROKER_URL/delete-kernel" \
              -H "Authorization: Bearer $BROKER_OIDC" \
              -H "content-type: application/json" \
              --data-binary @delete-gpu.json > delete-gpu-result.json; then
            echo "BOT2_GPU_RELEASED ref=$GPU_REF"
            VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
            BOT2_OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > gpu-released.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1]}))
          PY
            curl --fail-with-body -sS -X POST "$BOT2_API/gpu-released" \
              -H "Authorization: Bearer $BOT2_OIDC" \
              -H "content-type: application/json" \
              --data-binary @gpu-released.json > /dev/null
            echo "BOT2_GPU_STATE_CLEARED"
          else
            echo "::warning title=Bot2 GPU cleanup failed::Temporary GPU kernel cleanup failed; checkpoint remains safe."
          fi

      - name: Submit CPU TTS mix upload job
        if: steps.claim.outputs.run_job == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
          SOURCE_REF="$(cat source-kernel-ref.txt)"
          BROKER_OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-kaggle-broker" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          export BOT2_KAGGLE_BROKER_TOKEN="$BROKER_OIDC"
          if ! python scripts/bot2_submit_cpu_tts.py \
              --job bot2-job.json \
              --youtube-session youtube-session.json \
              --source-ref "$SOURCE_REF"; then
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"cpu_tts_submit","error":"Kaggle CPU TTS submission failed"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi
          CPU_REF="$(python -c 'import json; print(json.load(open("bot2-cpu-submission.json"))["ref"])')"
          TOKEN="$(python -c 'import json; print(json.load(open("bot2-job.json"))["job_token"])')"
          python - "$VIDEO_ID" "$CPU_REF" <<'PY' > cpu-stage.json
          import json,sys
          print(json.dumps({
              "source_video_id":sys.argv[1],
              "stage":"tts",
              "message":"CPU TTS/mix worker submitted ref="+sys.argv[2],
          }))
          PY
          curl --fail-with-body -sS -X POST "$BOT2_API/worker-stage" \
            -H "x-bot2-token: $TOKEN" -H "content-type: application/json" \
            --data-binary @cpu-stage.json > /dev/null
          echo "BOT2_CPU_TTS_SUBMITTED ref=$CPU_REF"

      - name: Follow CPU TTS mix and YouTube upload
        if: steps.claim.outputs.run_job == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          DONE=0
          for i in $(seq 1 300); do
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            curl --fail-with-body --retry 2 --retry-all-errors -sS -X POST "$BOT2_API/status" \
              -H "Authorization: Bearer $OIDC" -H "content-type: application/json" -d '{}' > bot2-status.json
            STATE="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d["status"])')"
            STAGE="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d["stage"])')"
            MSG="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d.get("last_message") or "")')"
            echo "BOT2_CPU_PROGRESS poll=$i state=$STATE stage=$STAGE message=$MSG"
            if [ "$STATE" = "failed" ]; then
              echo "::error title=Bot2 CPU stage stopped::$STAGE / $MSG"
              exit 1
            fi
            if [ "$STATE" = "idle" ] && [ "$STAGE" = "completed" ]; then
              YT_ID="$(python -c 'import json; d=json.load(open("bot2-status.json"))["state"]; print(d.get("youtube_video_id") or "")')"
              test -n "$YT_ID"
              echo "BOT2_COMPLETED youtube_video_id=$YT_ID"
              DONE=1
              break
            fi
            sleep 30
          done
          if [ "$DONE" != "1" ]; then
            VIDEO_ID="$(python -c 'import json; print(json.load(open("bot2-job.json"))["item"]["source_item_id"])')"
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-bot2" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            python - "$VIDEO_ID" <<'PY' > fail.json
          import json,sys
          print(json.dumps({"source_video_id":sys.argv[1],"stage":"cpu_processing_timeout","error":"CPU TTS/mix/upload did not finish within 150 minutes"}))
          PY
            curl -sS -X POST "$BOT2_API/fail" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @fail.json || true
            exit 1
          fi

      - name: Preserve compact evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          out={"bot":"Hidden Beyond Bot2"}
          try:
              d=json.load(open("bot2-status.json",encoding="utf-8"))
              out["state"]=d.get("state")
              if isinstance(out["state"],dict):
                  out["state"].pop("job_token_hash",None)
          except Exception:
              pass
          try:
              d=json.load(open("bot2-job.json",encoding="utf-8"))
              out["selected"]={
                  "rotation":d.get("rotation"),
                  "source_id":(d.get("item") or {}).get("source_id"),
                  "series_id":(d.get("item") or {}).get("series_id"),
                  "source_video_id":(d.get("item") or {}).get("source_item_id"),
                  "episode_number":(d.get("item") or {}).get("episode_number"),
              }
          except Exception:
              pass
          json.dump(out,open("bot2-evidence.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidden-beyond-bot2-evidence
          path: bot2-evidence.json
          if-no-files-found: warn
          retention-days: 7
